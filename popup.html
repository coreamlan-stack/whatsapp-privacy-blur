<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>WhatsApp Privacy Blur</title></head>
<body><main class="card">
  <header><div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.7 13.7L3 21l4.5-1.2A9 9 0 1 0 12 3Z"/><path d="M9.1 8.4c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.8 1.8c.1.3.1.5-.1.7l-.5.6c.5 1 1.3 1.8 2.4 2.3l.6-.6c.2-.2.4-.2.7-.1l1.8.8c.3.1.4.3.4.5v.5c0 .3-.1.5-.4.7-.5.3-1.2.4-1.8.2-2.4-.8-4.5-2.8-5.3-5.2-.2-.6-.1-1.3.2-1.8Z"/></svg></div><div><h1>Privacy Blur</h1><p id="status" role="status">Loading status…</p></div></header>
  <section class="master"><div><strong>Privacy mode</strong><span>Protect WhatsApp Web at a glance</span></div><label class="switch"><input id="enabled" type="checkbox"><span></span><b class="sr-only">Toggle privacy mode</b></label></section>
  <fieldset id="controls"><legend>What to blur</legend>
    <label class="setting"><span><i class="dot"></i>Chat list<small>Names, previews and times</small></span><input id="chatList" type="checkbox"></label>
    <label class="setting"><span><i class="dot"></i>Messages<small>Bubbles, replies and captions</small></span><input id="messages" type="checkbox"></label>
    <label class="setting"><span><i class="dot"></i>Profile photos<small>Contact and group avatars</small></span><input id="profilePhotos" type="checkbox"></label>
    <label class="setting"><span><i class="dot"></i>Media<small>Photos, videos and stickers</small></span><input id="media" type="checkbox"></label>
  </fieldset>
  <section class="hover"><div><strong>Reveal on hover</strong><span>Clear only the item under your pointer</span></div><label class="switch"><input id="revealOnHover" type="checkbox"><span></span><b class="sr-only">Toggle reveal on hover</b></label></section>
  <footer><span>Shortcut</span><kbd id="shortcut">Ctrl + Shift + Y</kbd><a href="chrome://extensions/shortcuts" target="_blank">Change</a></footer>
</main><script src="popup.js"></script></body></html>
